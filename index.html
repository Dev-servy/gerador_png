<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/ALGORITMO.DA.VEZ (1).png" type="image/x-icon">
    <title>Roteiro Completo de Estudos - Desenvolvimento</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #010409;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --blue: #58a6ff;
            --green: #3fb950;
            --orange: #ffa657;
            --purple: #bc8cff;
            --pink: #f778ba;
            --red: #f85149;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(165deg, #0d1117, #161b22, #0d1117);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px;
            gap: 40px;
            line-height: 1.6;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        /* MENU */
        #menu {
            width: 300px;
            padding: 25px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: sticky;
            top: 30px;
            max-height: calc(100vh - 60px);
            overflow-y: auto;
        }

        #menu h3 {
            text-align: center;
            color: var(--blue);
            font-size: 20px;
            margin-bottom: 8px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        #menu a {
            text-decoration: none;
            color: var(--text-primary);
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: .25s;
            font-size: 15px;
            font-weight: 600;
        }

        #menu a:hover {
            background: rgba(56, 139, 253, .10);
            border-color: var(--blue);
            color: var(--blue);
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(31, 111, 235, .15);
        }

        #menu a:active {
            transform: scale(.97);
        }

        #menu .badge {
            background: var(--blue);
            color: #000;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 20px;
            margin-left: auto;
            font-weight: bold;
        }

        /* CONTEÚDO */
        #conteudos {
            width: 950px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            transition: .3s;
        }

        .card:hover {
            border-color: var(--blue);
            box-shadow: 0 12px 40px rgba(31, 111, 235, .10);
        }

        .card>h2 {
            color: var(--blue);
            font-size: 26px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card>h2 .icon {
            font-size: 32px;
        }

        .badge-count {
            background: var(--border);
            color: var(--text-secondary);
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            margin-left: 10px;
            font-weight: normal;
        }

        /* DETAILS */
        details {
            margin: 12px 0;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(13, 17, 23, 0.5);
            transition: .3s;
        }

        details:hover {
            border-color: #484f58;
        }

        details[open] {
            border-color: var(--blue);
            background: rgba(56, 139, 253, 0.03);
        }

        summary {
            padding: 16px 20px;
            cursor: pointer;
            font-weight: 700;
            font-size: 17px;
            color: var(--text-primary);
            list-style: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: .2s;
            border-radius: 12px;
        }

        summary:hover {
            color: var(--blue);
            background: rgba(56, 139, 253, 0.05);
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary::before {
            content: "▶";
            font-size: 12px;
            transition: .3s;
            color: var(--blue);
            min-width: 16px;
        }

        details[open]>summary::before {
            transform: rotate(90deg);
        }

        details[open]>summary {
            color: var(--blue);
            border-bottom: 1px solid var(--border);
            border-radius: 12px 12px 0 0;
        }

        .details-content {
            padding: 20px;
        }

        /* SUB-DETAILS */
        .sub-details {
            margin: 10px 0;
            border: 1px solid rgba(48, 54, 61, 0.5);
            border-radius: 8px;
            background: rgba(22, 27, 34, 0.5);
        }

        .sub-details summary {
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .sub-details summary:hover {
            color: var(--green);
            background: rgba(63, 185, 80, 0.05);
        }

        .sub-details[open] {
            border-color: var(--green);
        }

        .sub-details[open]>summary {
            color: var(--green);
            border-bottom: 1px solid rgba(48, 54, 61, 0.5);
        }

        .sub-details summary::before {
            content: "▸";
            color: var(--green);
        }

        .sub-details-content {
            padding: 15px 20px;
        }

        /* LISTAS */
        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 7px 0;
            padding-left: 20px;
            position: relative;
            color: var(--text-primary);
        }

        li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--blue);
            font-weight: bold;
        }

        .tag {
            display: inline-block;
            background: rgba(88, 166, 255, 0.15);
            color: var(--blue);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin: 0 2px;
            font-family: 'Courier New', monospace;
        }

        .tag-green {
            background: rgba(63, 185, 80, 0.15);
            color: var(--green);
        }

        .tag-orange {
            background: rgba(255, 166, 87, 0.15);
            color: var(--orange);
        }

        .tag-purple {
            background: rgba(188, 140, 255, 0.15);
            color: var(--purple);
        }

        .highlight {
            color: var(--orange);
            font-weight: bold;
        }

        .note {
            background: rgba(88, 166, 255, 0.08);
            border-left: 3px solid var(--blue);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            margin: 12px 0;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .note strong {
            color: var(--blue);
        }

        /* RESPONSIVO */
        @media (max-width: 1300px) {
            body {
                flex-direction: column;
                align-items: center;
                padding: 20px;
            }

            #menu {
                width: 100%;
                max-width: 950px;
                position: static;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 8px;
                padding: 20px;
                max-height: none;
            }

            #menu h3 {
                width: 100%;
                margin-bottom: 0;
            }

            #menu a {
                flex: 1 1 auto;
                text-align: center;
                justify-content: center;
                padding: 12px 16px;
                font-size: 14px;
            }

            #conteudos {
                width: 100%;
                max-width: 950px;
            }
        }
    </style>
</head>
