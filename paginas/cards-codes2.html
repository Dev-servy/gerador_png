<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Carrossel de Código — Instagram</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Fonte do sistema e código */
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;600;700&display=swap');

        :root {
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'Fira Code', monospace;
        }

        /* =========================================================
   TEMAS DO CARD (PADRÃO OBRIGATÓRIO)
   ========================================================= */

        /* ---------- TEMA 1 — Dark Code ---------- */
        .theme-dark {
            background: linear-gradient(165deg, #0d1117 0%, #161b22 60%, #0d1117 100%);
            color: #e6edf3;
        }

        .theme-dark .post-avatar {
            background: #1f6feb22;
            color: #58a6ff;
            border: 1px solid #1f6feb55;
        }

        .theme-dark .post-handle {
            color: #58a6ff;
        }

        .theme-dark .post-lang-badge {
            background: #238636;
            color: #eafff0;
        }

        .theme-dark .post-title {
            color: #f0f6fc;
        }

        .theme-dark .post-title::after {
            content: "";
            display: block;
            width: 84px;
            height: 6px;
            margin-top: 18px;
            border-radius: 4px;
            background: #3fb950;
        }

        .theme-dark .code-box {
            background: #010409;
            border: 1px solid #30363d;
        }

        .theme-dark .code-box-bar {
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }

        .theme-dark .code-box-filename {
            color: #8b949e;
        }

        .theme-dark .code-box-body {
            color: #c9d1d9;
        }

        .theme-dark .tip-box {
            background: rgba(56, 139, 253, .08);
            border: 1px solid rgba(56, 139, 253, .35);
        }

        .theme-dark .tip-box p {
            color: #e6edf3;
        }

        .theme-dark .tip-label {
            color: #58a6ff;
        }

        .theme-dark .post-footer {
            color: #8b949e;
        }

        .theme-dark .hljs-keyword,
        .theme-dark .hljs-built_in,
        .theme-dark .hljs-selector-tag {
            color: #ff7b72;
        }

        .theme-dark .hljs-string,
        .theme-dark .hljs-attr {
            color: #a5d6ff;
        }

        .theme-dark .hljs-comment {
            color: #8b949e;
            font-style: italic;
        }

        .theme-dark .hljs-title,
        .theme-dark .hljs-function_,
        .theme-dark .hljs-title.function_ {
            color: #d2a8ff;
        }

        .theme-dark .hljs-number,
        .theme-dark .hljs-literal {
            color: #79c0ff;
        }

        .theme-dark .hljs-variable,
        .theme-dark .hljs-params {
            color: #ffa657;
        }

        /* ---------- TEMA 2 — Neon Synth ---------- */
        .theme-neon {
            background: radial-gradient(circle at 15% 15%, rgba(255, 110, 199, .35), transparent 45%), radial-gradient(circle at 90% 85%, rgba(0, 229, 255, .30), transparent 50%), linear-gradient(150deg, #150a2e 0%, #241245 45%, #0c1b33 100%);
            color: #f3ecff;
        }

        .theme-neon .post-avatar {
            background: rgba(255, 110, 199, .15);
            color: #ff6ec7;
            border: 1px solid rgba(255, 110, 199, .55);
            box-shadow: 0 0 18px rgba(255, 110, 199, .35);
        }

        .theme-neon .post-handle {
            color: #ff9ee0;
            text-shadow: 0 0 14px rgba(255, 110, 199, .55);
        }

        .theme-neon .post-lang-badge {
            background: rgba(0, 229, 255, .14);
            color: #7cf3ff;
            border: 1px solid rgba(0, 229, 255, .5);
            box-shadow: 0 0 16px rgba(0, 229, 255, .3);
        }

        .theme-neon .post-title {
            background: linear-gradient(90deg, #7cf3ff, #ff9ee0 60%, #ffe27a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .theme-neon .post-title::after {
            content: "";
            display: block;
            width: 84px;
            height: 6px;
            margin-top: 18px;
            border-radius: 4px;
            background: linear-gradient(90deg, #7cf3ff, #ff6ec7);
            box-shadow: 0 0 14px rgba(124, 243, 255, .6);
        }

        .theme-neon .code-box {
            background: rgba(9, 6, 20, .72);
            border: 1px solid rgba(124, 243, 255, .35);
            box-shadow: 0 0 30px -6px rgba(124, 243, 255, .25) inset;
        }

        .theme-neon .code-box-bar {
            background: rgba(255, 255, 255, .03);
            border-bottom: 1px solid rgba(124, 243, 255, .25);
        }

        .theme-neon .code-box-filename {
            color: #b8a9e8;
        }

        .theme-neon .code-box-body {
            color: #eae2ff;
        }

        .theme-neon .tip-box {
            background: rgba(0, 229, 255, .08);
            border: 1px solid rgba(0, 229, 255, .4);
        }

        .theme-neon .tip-box p {
            color: #f3ecff;
        }

        .theme-neon .tip-label {
            color: #7cf3ff;
            text-shadow: 0 0 10px rgba(124, 243, 255, .5);
        }

        .theme-neon .post-footer {
            color: #c8b8f0;
        }

        .theme-neon .hljs-keyword,
        .theme-neon .hljs-built_in,
        .theme-neon .hljs-selector-tag {
            color: #ff6ec7;
        }

        .theme-neon .hljs-string,
        .theme-neon .hljs-attr {
            color: #7cffcb;
        }

        .theme-neon .hljs-comment {
            color: #8888c0;
            font-style: italic;
        }

        .theme-neon .hljs-title,
        .theme-neon .hljs-function_,
        .theme-neon .hljs-title.function_ {
            color: #ffe66d;
        }

        .theme-neon .hljs-number,
        .theme-neon .hljs-literal {
            color: #7cd7ff;
        }

        .theme-neon .hljs-variable,
        .theme-neon .hljs-params {
            color: #c9a4ff;
        }

        /* ---------- TEMA 3 — Clean Light ---------- */
        .theme-light {
            background: linear-gradient(165deg, #ffffff 0%, #f4f6f9 100%);
            color: #0f172a;
        }

        .theme-light .post-avatar {
            background: #eef2ff;
            color: #4338ca;
            border: 1px solid #c7d2fe;
        }

        .theme-light .post-handle {
            color: #1d4ed8;
        }

        .theme-light .post-lang-badge {
            background: #0f172a;
            color: #fff;
        }

        .theme-light .post-title {
            color: #0f172a;
        }

        .theme-light .post-title::after {
            content: "";
            display: block;
            width: 84px;
            height: 6px;
            margin-top: 18px;
            border-radius: 4px;
            background: #f97316;
        }

        .theme-light .code-box {
            background: #0f1115;
            border: 1px solid #1f2430;
            box-shadow: 0 20px 40px -20px rgba(15, 23, 42, .35);
        }

        .theme-light .code-box-bar {
            background: #16191f;
            border-bottom: 1px solid #262b35;
        }

        .theme-light .code-box-filename {
            color: #8b95a5;
        }

        .theme-light .code-box-body {
            color: #e6e9ef;
        }

        .theme-light .tip-box {
            background: #fff7ed;
            border: 1px solid #fdba74;
        }

        .theme-light .tip-box p {
            color: #7c2d12;
        }

        .theme-light .tip-label {
            color: #ea580c;
        }

        .theme-light .post-footer {
            color: #64748b;
        }

        .theme-light .hljs-keyword,
        .theme-light .hljs-built_in,
        .theme-light .hljs-selector-tag {
            color: #ff7b72;
        }

        .theme-light .hljs-string,
        .theme-light .hljs-attr {
            color: #a5d6ff;
        }

        .theme-light .hljs-comment {
            color: #8b949e;
            font-style: italic;
        }

        .theme-light .hljs-title,
        .theme-light .hljs-function_,
        .theme-light .hljs-title.function_ {
            color: #d2a8ff;
        }

        .theme-light .hljs-number,
        .theme-light .hljs-literal {
            color: #79c0ff;
        }

        .theme-light .hljs-variable,
        .theme-light .hljs-params {
            color: #ffa657;
        }

        /* ---------- TEMA 4 — Retro Terminal ---------- */
        .theme-retro {
            background: #050805;
            color: #3dff85;
            font-family: var(--font-mono);
        }

        .theme-retro::after {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg, rgba(61, 255, 133, .05) 0px, rgba(61, 255, 133, .05) 1px, transparent 1px, transparent 3px);
            pointer-events: none;
            mix-blend-mode: overlay;
            z-index: 1;
        }

        .theme-retro .post-avatar {
            background: transparent;
            color: #3dff85;
            border: 2px solid #3dff85;
        }

        .theme-retro .post-handle {
            color: #3dff85;
            text-shadow: 0 0 8px rgba(61, 255, 133, .6);
        }

        .theme-retro .post-lang-badge {
            background: transparent;
            color: #3dff85;
            border: 2px solid #3dff85;
            border-radius: 4px;
        }

        .theme-retro .post-title {
            color: #baffcf;
            text-transform: uppercase;
            letter-spacing: .02em;
            text-shadow: 0 0 12px rgba(61, 255, 133, .5);
            font-family: var(--font-mono);
        }

        .theme-retro .post-title::after {
            content: "";
            display: block;
            width: 84px;
            height: 4px;
            margin-top: 18px;
            background: #3dff85;
            box-shadow: 0 0 10px rgba(61, 255, 133, .7);
        }

        .theme-retro .code-box {
            background: #020a03;
            border: 1px solid #1f7a44;
        }

        .theme-retro .code-box-bar {
            background: #03130a;
            border-bottom: 1px solid #1f7a44;
        }

        .theme-retro .code-box-filename {
            color: #2fae66;
        }

        .theme-retro .code-box-body {
            color: #8dffb3;
        }

        .theme-retro .tip-box {
            background: rgba(61, 255, 133, .05);
            border: 1px dashed #2fae66;
            border-radius: 4px;
        }

        .theme-retro .tip-box p {
            color: #c8ffdc;
            font-family: var(--font-mono);
        }

        .theme-retro .tip-label {
            color: #3dff85;
        }

        .theme-retro .post-footer {
            color: #2fae66;
        }

        .theme-retro .hljs-keyword,
        .theme-retro .hljs-built_in {
            color: #ffffff;
            font-weight: 700;
        }

        .theme-retro .hljs-string,
        .theme-retro .hljs-attr {
            color: #8dffb3;
        }

        .theme-retro .hljs-comment {
            color: #1f7a44;
            font-style: italic;
        }

        /* =========================================================
   APP SHELL — Ferramenta (não faz parte do card exportado)
   ========================================================= */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-sans);
            background: #0a0b0f;
            color: #e7e9ee;
            -webkit-font-smoothing: antialiased;
        }

        .app-shell {
            display: grid;
            grid-template-columns: 420px 1fr;
            min-height: 100vh;
        }

        @media (max-width: 980px) {
            .app-shell {
                grid-template-columns: 1fr;
            }
        }

        /* -------- Painel de controle -------- */
        .control-panel {
            background: #101218;
            border-right: 1px solid #1e2129;
            padding: 28px 24px 120px;
            overflow-y: auto;
            max-height: 100vh;
        }

        @media (max-width: 980px) {
            .control-panel {
                max-height: none;
            }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 26px;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: linear-gradient(135deg, #7c5cff, #37e0d1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            color: #0a0b0f;
            flex-shrink: 0;
        }

        .brand-text h1 {
            font-size: 14.5px;
            margin: 0;
            font-weight: 700;
            letter-spacing: .01em;
        }

        .brand-text p {
            font-size: 11.5px;
            margin: 2px 0 0;
            color: #82869a;
        }

        .field-group {
            margin-bottom: 20px;
        }

        .field-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #9aa0b4;
            margin-bottom: 7px;
            letter-spacing: .01em;
        }

        .field-group input[type="text"],
        .field-group select,
        .field-group textarea {
            width: 100%;
            background: #181b23;
            border: 1px solid #2a2e3a;
            color: #e7e9ee;
            border-radius: 9px;
            padding: 10px 12px;
            font-size: 13.5px;
            font-family: var(--font-sans);
            outline: none;
            transition: border-color .15s ease;
        }

        .field-group textarea {
            font-family: var(--font-mono);
            font-size: 12.5px;
            resize: vertical;
            min-height: 90px;
            line-height: 1.5;
        }

        .field-group input:focus,
        .field-group select:focus,
        .field-group textarea:focus {
            border-color: #7c5cff;
        }

        .section-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: #5a5f72;
            font-weight: 700;
            margin: 28px 0 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-label::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #22252e;
        }

        .code-block-card {
            background: #14161d;
            border: 1px solid #262a35;
            border-radius: 12px;
            padding: 14px 14px 16px;
            margin-bottom: 14px;
            position: relative;
        }

        .code-block-card .row2 {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .remove-file-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #6b7086;
            font-size: 12px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
        }

        .remove-file-btn:hover {
            background: #251418;
            color: #ff6b6b;
        }

        .tip-field {
            margin-top: 10px;
        }

        .tip-field label {
            font-size: 11px;
            color: #6b7086;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: transform .1s ease, opacity .15s ease;
        }

        .btn:active {
            transform: scale(.98);
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-add {
            background: #181b23;
            border: 1px dashed #383d4c;
            color: #b7bccb;
        }

        .btn-add:hover {
            border-color: #7c5cff;
            color: #fff;
        }

        .btn-process {
            background: #1c1f29;
            border: 1px solid #2a2e3a;
            color: #e7e9ee;
            margin-top: 8px;
        }

        .btn-process:hover {
            border-color: #4b4f5e;
        }

        .btn-download {
            background: linear-gradient(135deg, #7c5cff, #5b8cff);
            color: #fff;
            margin-top: 12px;
            box-shadow: 0 8px 20px -8px rgba(124, 92, 255, .6);
        }

        .btn-download:hover {
            filter: brightness(1.08);
        }

        .status-line {
            font-size: 11.5px;
            color: #6b7086;
            text-align: center;
            margin-top: 10px;
            min-height: 14px;
        }

        /* -------- Área de preview -------- */
        .preview-panel {
            padding: 28px 32px 80px;
            overflow-y: auto;
        }

        .preview-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 22px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .preview-header h2 {
            font-size: 15.5px;
            margin: 0;
            font-weight: 700;
        }

        .preview-header span {
            font-size: 12px;
            color: #6b7086;
        }

        .empty-state {
            border: 1px dashed #262a35;
            border-radius: 16px;
            padding: 60px 24px;
            text-align: center;
            color: #545869;
            font-size: 13.5px;
            max-width: 480px;
        }

        .carousel-track {
            display: flex;
            flex-wrap: wrap;
            gap: 22px;
        }

        .carousel-card-wrap {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .carousel-card-label {
            font-size: 11.5px;
            color: #6b7086;
            font-weight: 600;
            padding-left: 2px;
        }

        /* viewport que recorta o card 1080x1080 escalado para exibição */
        .card-scale-viewport {
            width: 300px;
            height: 300px;
            overflow: hidden;
            border-radius: 14px;
            border: 1px solid #22252e;
            position: relative;
            background: #000;
        }

        /* -------- Estrutura interna do card (1080x1080 físico) -------- */
        .post-preview {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            transform: scale(0.27778);
            /* 300/1080 */
            transform-origin: top left;
            font-family: var(--font-sans);
        }

        .post-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            padding: 64px 64px 52px;
            display: flex;
            flex-direction: column;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
        }

        .post-avatar {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 30px;
            flex-shrink: 0;
        }

        .post-handle {
            font-size: 30px;
            font-weight: 600;
            flex: 1;
        }

        .post-lang-badge {
            font-size: 22px;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .post-title {
            font-size: 46px;
            font-weight: 700;
            line-height: 1.25;
            margin: 0 0 30px;
            font-family: var(--font-sans);
        }

        .code-box {
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .code-box-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 24px;
            flex-shrink: 0;
        }

        .code-box-dots {
            display: flex;
            gap: 8px;
        }

        .code-box-dots i {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #4b5163;
            display: block;
        }

        .code-box-filename {
            font-family: var(--font-mono);
            font-size: 19px;
            margin-left: 4px;
        }

        .code-box-body {
            flex: 1;
            min-height: 0;
            padding: 26px 28px;
            overflow: hidden;
        }

        .code-box-body pre {
            margin: 0;
            height: 100%;
        }

        .code-box-body code {
            font-family: var(--font-mono);
            white-space: pre;
            display: block;
        }

        .code-box-body .code-line {
            display: flex;
        }

        .code-box-body .line-no {
            display: inline-block;
            width: 2.6em;
            flex-shrink: 0;
            opacity: .35;
            user-select: none;
            text-align: right;
            margin-right: 1.4em;
        }

        .tip-box {
            border-radius: 14px;
            padding: 20px 24px;
            margin-top: 24px;
            flex-shrink: 0;
        }

        .tip-label {
            font-size: 17px;
            font-weight: 700;
            display: block;
            margin-bottom: 6px;
        }

        .tip-box p {
            font-size: 20px;
            line-height: 1.45;
            margin: 0;
        }

        .post-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 24px;
            font-size: 20px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .page-indicator {
            font-family: var(--font-mono);
            opacity: .8;
        }

        /* elemento de medição, invisível, usado só para calcular altura disponível */
        #measure-probe {
            position: fixed;
            left: -20000px;
            top: 0;
            visibility: hidden;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div class="app-shell">

        <!-- ================= PAINEL DE CONTROLE ================= -->
        <aside class="control-panel">
            <div class="brand">
                <div class="brand-mark">&lt;/&gt;</div>
                <div class="brand-text">
                    <h1>Carrossel de Código</h1>
                    <p>Gerador de cards para Instagram</p>
                </div>
            </div>

            <div class="field-group">
                <label for="input-handle">Handle / Instagram</label>
                <input type="text" id="input-handle" placeholder="@algoritmo.da.vez" value="@algoritmo.da.vez">
            </div>

            <div class="field-group">
                <label for="input-title">Título do Post / Projeto</label>
                <input type="text" id="input-title" placeholder="Card de Perfil Responsivo"
                    value="Card de Perfil Responsivo">
            </div>

            <div class="field-group">
                <label for="input-theme">Tema Visual</label>
                <select id="input-theme">
                    <option value="theme-dark">Dark Code</option>
                    <option value="theme-neon">Neon Synth</option>
                    <option value="theme-light">Clean Light</option>
                    <option value="theme-retro">Retro Terminal</option>
                </select>
            </div>

            <div class="section-label">Arquivos de código</div>
            <div id="code-blocks-container"></div>
            <button class="btn btn-add" id="btn-add-file" type="button">➕ Adicionar Outro Arquivo de Código</button>

            <div class="section-label">Ações</div>
            <button class="btn btn-process" id="btn-process" type="button">🔄 Processar e Paginar Código</button>
            <button class="btn btn-download" id="btn-download" type="button" disabled>📦 Baixar Todos os Cards
                (PNG)</button>
            <div class="status-line" id="status-line"></div>
        </aside>

        <!-- ================= PREVIEW ================= -->
        <main class="preview-panel">
            <div class="preview-header">
                <h2>Preview do carrossel</h2>
                <span id="preview-count">nenhum card gerado ainda</span>
            </div>
            <div id="preview-empty" class="empty-state">
                Preencha os arquivos de código ao lado e clique em <strong>“Processar e Paginar Código”</strong>
                para ver os cards do carrossel aparecerem aqui.
            </div>
            <div class="carousel-track" id="carousel-track"></div>
        </main>

    </div>

    <!-- elemento oculto usado apenas para medir a altura útil da caixa de código -->
    <div id="measure-probe"></div>

    <script>
        (function () {
            "use strict";

            /* =========================================================
               ESTADO
               ========================================================= */
            let blockIdCounter = 0;
            let codeBlocks = [];
            let renderedPages = []; // páginas geradas após "Processar"

            const LANGUAGES = [
                ["html", "HTML"],
                ["css", "CSS"],
                ["javascript", "JavaScript"],
                ["typescript", "TypeScript"],
                ["python", "Python"],
                ["json", "JSON"],
                ["bash", "Bash / Shell"],
                ["sql", "SQL"],
                ["java", "Java"],
                ["cpp", "C++"],
                ["php", "PHP"],
                ["markdown", "Markdown"],
                ["plaintext", "Texto simples"]
            ];

            function makeBlock(filename, language, code, tip) {
                blockIdCounter += 1;
                return { id: "blk-" + blockIdCounter, filename: filename || "", language: language || "html", code: code || "", tip: tip || "" };
            }

            // blocos de exemplo iniciais
            codeBlocks.push(makeBlock(
                "index.html",
                "html",
                "<div class=\"card\">\n  <img src=\"avatar.png\" alt=\"\" class=\"avatar\">\n  <h2 class=\"name\">Ana Souza</h2>\n  <p class=\"role\">Frontend Developer</p>\n  <div class=\"tags\">\n    <span>JS</span>\n    <span>CSS</span>\n    <span>HTML</span>\n  </div>\n</div>",
                "Comece sempre pela estrutura semântica antes de pensar em estilo."
            ));
            codeBlocks.push(makeBlock(
                "styles.css",
                "css",
                ".card {\n  width: 280px;\n  padding: 24px;\n  border-radius: 16px;\n  background: #101218;\n  text-align: center;\n}\n\n.avatar {\n  width: 84px;\n  height: 84px;\n  border-radius: 50%;\n  margin-bottom: 12px;\n}\n\n.tags span {\n  display: inline-block;\n  margin: 4px;\n  padding: 4px 10px;\n  border-radius: 999px;\n  background: #1c1f29;\n  font-size: 12px;\n}",
                ""
            ));

            /* =========================================================
               PAINEL — RENDERIZAÇÃO DO FORMULÁRIO DE ARQUIVOS
               ========================================================= */
            const container = document.getElementById("code-blocks-container");

            function languageOptionsHtml(selected) {
                return LANGUAGES.map(function (pair) {
                    const sel = pair[0] === selected ? " selected" : "";
                    return '<option value="' + pair[0] + '"' + sel + '>' + pair[1] + '</option>';
                }).join("");
            }

            function renderBlocksForm() {
                container.innerHTML = "";
                codeBlocks.forEach(function (block) {
                    const card = document.createElement("div");
                    card.className = "code-block-card";
                    card.dataset.id = block.id;
                    card.innerHTML =
                        '<button type="button" class="remove-file-btn" data-action="remove">✕ remover</button>' +
                        '<div class="row2">' +
                        '<div class="field-group" style="margin-bottom:0;">' +
                        '<label>Nome do Arquivo</label>' +
                        '<input type="text" data-field="filename" value="' + escapeAttr(block.filename) + '" placeholder="ex: index.html">' +
                        '</div>' +
                        '<div class="field-group" style="margin-bottom:0;">' +
                        '<label>Linguagem</label>' +
                        '<select data-field="language">' + languageOptionsHtml(block.language) + '</select>' +
                        '</div>' +
                        '</div>' +
                        '<div class="field-group" style="margin-bottom:0;">' +
                        '<label>Código Fonte</label>' +
                        '<textarea data-field="code" placeholder="Cole o código aqui...">' + escapeHtml(block.code) + '</textarea>' +
                        '</div>' +
                        '<div class="field-group tip-field">' +
                        '<label>💡 Dica (opcional, aparece na primeira página deste arquivo)</label>' +
                        '<input type="text" data-field="tip" value="' + escapeAttr(block.tip) + '" placeholder="ex: sempre valide os inputs do usuário">' +
                        '</div>';
                    container.appendChild(card);

                    card.querySelector('[data-action="remove"]').addEventListener("click", function () {
                        codeBlocks = codeBlocks.filter(function (b) { return b.id !== block.id; });
                        renderBlocksForm();
                    });
                    card.querySelector('[data-field="filename"]').addEventListener("input", function (e) {
                        block.filename = e.target.value;
                    });
                    card.querySelector('[data-field="language"]').addEventListener("change", function (e) {
                        block.language = e.target.value;
                    });
                    card.querySelector('[data-field="code"]').addEventListener("input", function (e) {
                        block.code = e.target.value;
                    });
                    card.querySelector('[data-field="tip"]').addEventListener("input", function (e) {
                        block.tip = e.target.value;
                    });
                });
            }

            function escapeHtml(str) {
                return String(str || "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");
            }
            function escapeAttr(str) {
                return escapeHtml(str).replace(/"/g, "&quot;");
            }

            document.getElementById("btn-add-file").addEventListener("click", function () {
                codeBlocks.push(makeBlock("", "html", "", ""));
                renderBlocksForm();
            });

            renderBlocksForm();

            /* =========================================================
               PAGINAÇÃO INTELIGENTE
               ========================================================= */
            const FONT_MAX = 24;
            const FONT_MIN = 18;
            const LINE_HEIGHT_RATIO = 1.55;
            const MIN_LAST_PAGE_LINES = 5;

            // Constrói um card de medição (sem código) igual ao card real, pra saber
            // quantos px de altura sobram pra caixa de código naquele tema/título/dica.
            function measureCodeBoxHeight(theme, title, hasTip) {
                const probe = document.getElementById("measure-probe");
                probe.innerHTML =
                    '<div class="post-preview ' + theme + '" style="transform:none;">' +
                    '<div class="post-content">' +
                    '<div class="post-header">' +
                    '<div class="post-avatar">AB</div>' +
                    '<div class="post-handle">@handle</div>' +
                    '<div class="post-lang-badge">LANG</div>' +
                    '</div>' +
                    '<h1 class="post-title">' + escapeHtml(title) + '</h1>' +
                    '<div class="code-box">' +
                    '<div class="code-box-bar">' +
                    '<span class="code-box-dots"><i></i><i></i><i></i></span>' +
                    '<span class="code-box-filename">file.ext</span>' +
                    '</div>' +
                    '<div class="code-box-body" id="probe-code-body"></div>' +
                    '</div>' +
                    (hasTip ? '<div class="tip-box"><span class="tip-label">💡 Dica</span><p>texto de exemplo de dica com duas linhas para medir espaço extra usado no card final</p></div>' : '') +
                    '<div class="post-footer"><span>Arraste para o lado ➜</span><span class="page-indicator">1/1</span></div>' +
                    '</div>' +
                    '</div>';
                const bodyEl = probe.querySelector("#probe-code-body");
                const height = bodyEl.clientHeight;
                return height;
            }

            function linesCapacityForHeight(heightPx, fontSize) {
                const lineHeightPx = fontSize * LINE_HEIGHT_RATIO;
                return Math.max(1, Math.floor(heightPx / lineHeightPx));
            }

            // Retorna { fontSize, maxLines } — usa a menor fonte permitida quando o
            // arquivo precisa de mais de uma página, pra caber o máximo de linhas
            // possível em cada card; usa a fonte máxima quando cabe tudo numa página.
            function chooseFontAndCapacity(codeBoxHeight, totalLines) {
                const maxLinesAtMaxFont = linesCapacityForHeight(codeBoxHeight, FONT_MAX);
                if (totalLines <= maxLinesAtMaxFont) {
                    return { fontSize: FONT_MAX, maxLines: maxLinesAtMaxFont };
                }
                const maxLinesAtMinFont = linesCapacityForHeight(codeBoxHeight, FONT_MIN);
                if (totalLines <= maxLinesAtMinFont) {
                    // cabe tudo numa página só se usar a fonte mínima
                    return { fontSize: FONT_MIN, maxLines: maxLinesAtMinFont };
                }
                // não cabe tudo mesmo na fonte mínima -> paginar usando a fonte mínima
                // (máxima densidade possível), depois balancear as páginas
                return { fontSize: FONT_MIN, maxLines: maxLinesAtMinFont };
            }

            // Divide `lines` em páginas balanceadas (sem "linhas órfãs" no final)
            function paginateLines(lines, maxLinesPerPage) {
                const total = lines.length;
                if (total <= maxLinesPerPage) return [lines];
                let pageCount = Math.ceil(total / maxLinesPerPage);
                let perPage = Math.ceil(total / pageCount);
                // regra de sobras: se a última página ficaria com menos de
                // MIN_LAST_PAGE_LINES linhas, redistribui aumentando o nº de páginas
                // usadas (perPage menor) até equilibrar, sem nunca passar do máximo.
                while (perPage > maxLinesPerPage) {
                    pageCount += 1;
                    perPage = Math.ceil(total / pageCount);
                }
                const lastPageLines = total - perPage * (pageCount - 1);
                if (lastPageLines > 0 && lastPageLines < MIN_LAST_PAGE_LINES && pageCount > 1) {
                    // tenta reduzir perPage em 1 pra puxar linhas da última página
                    const altPerPage = perPage - 1;
                    if (altPerPage > 0) {
                        const altPageCount = Math.ceil(total / altPerPage);
                        if (altPerPage <= maxLinesPerPage) {
                            perPage = altPerPage;
                            pageCount = altPageCount;
                        }
                    }
                }
                const pages = [];
                for (let i = 0; i < pageCount; i++) {
                    pages.push(lines.slice(i * perPage, (i + 1) * perPage));
                }
                return pages;
            }

            function initials(handle) {
                const clean = (handle || "").replace(/^@/, "").trim();
                if (!clean) return "</>";
                const parts = clean.split(/[.\-_\s]+/).filter(Boolean);
                if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
                return clean.substring(0, 2).toUpperCase();
            }

            function langLabel(langValue) {
                const found = LANGUAGES.find(function (p) { return p[0] === langValue; });
                return found ? found[1] : langValue.toUpperCase();
            }

            /* =========================================================
               PROCESSAR E PAGINAR
               ========================================================= */
            const trackEl = document.getElementById("carousel-track");
            const emptyStateEl = document.getElementById("preview-empty");
            const previewCountEl = document.getElementById("preview-count");
            const downloadBtn = document.getElementById("btn-download");
            const statusLine = document.getElementById("status-line");

            document.getElementById("btn-process").addEventListener("click", processAndPaginate);

            function processAndPaginate() {
                const handle = document.getElementById("input-handle").value.trim() || "@seu.usuario";
                const title = document.getElementById("input-title").value.trim() || "Sem título";
                const theme = document.getElementById("input-theme").value;

                const validBlocks = codeBlocks.filter(function (b) { return b.filename.trim() && b.code.trim(); });

                if (validBlocks.length === 0) {
                    statusLine.textContent = "Adicione ao menos um arquivo com nome e código.";
                    return;
                }

                // 1) monta as páginas de cada arquivo
                const allPages = [];
                validBlocks.forEach(function (block) {
                    const lines = block.code.replace(/\r\n/g, "\n").split("\n");
                    const hasTip = !!block.tip.trim();
                    const codeBoxHeight = measureCodeBoxHeight(theme, title, hasTip);
                    const capacity = chooseFontAndCapacity(codeBoxHeight, lines.length);
                    const pages = paginateLines(lines, capacity.maxLines);

                    pages.forEach(function (pageLines, idx) {
                        allPages.push({
                            handle: handle,
                            title: title,
                            theme: theme,
                            filename: block.filename.trim(),
                            language: block.language,
                            fontSize: capacity.fontSize,
                            lines: pageLines,
                            tip: idx === 0 ? block.tip.trim() : "",
                            fileIndex: idx + 1,
                            fileTotal: pages.length
                        });
                    });
                });

                // 2) numera globalmente (1/N do carrossel inteiro)
                const total = allPages.length;
                allPages.forEach(function (p, i) { p.globalIndex = i + 1; p.globalTotal = total; });

                renderedPages = allPages;
                renderCards();
            }

            function renderCards() {
                trackEl.innerHTML = "";
                if (renderedPages.length === 0) {
                    emptyStateEl.style.display = "block";
                    downloadBtn.disabled = true;
                    previewCountEl.textContent = "nenhum card gerado ainda";
                    return;
                }
                emptyStateEl.style.display = "none";
                downloadBtn.disabled = false;
                previewCountEl.textContent = renderedPages.length + (renderedPages.length === 1 ? " card gerado" : " cards gerados");

                const handleTxt = renderedPages[0].handle;

                renderedPages.forEach(function (page) {
                    const wrap = document.createElement("div");
                    wrap.className = "carousel-card-wrap";

                    const label = document.createElement("div");
                    label.className = "carousel-card-label";
                    label.textContent = "Card " + page.globalIndex + "/" + page.globalTotal + " — " + page.filename;
                    wrap.appendChild(label);

                    const viewport = document.createElement("div");
                    viewport.className = "card-scale-viewport";

                    const cardEl = buildCardElement(page, handleTxt);
                    viewport.appendChild(cardEl);
                    wrap.appendChild(viewport);

                    trackEl.appendChild(wrap);
                });
            }

            function buildCodeHtml(lines, language) {
                // gera <span class="code-line"><span class="line-no">N</span>...code...</span>
                const codeHtml = lines.map(function (line, i) {
                    return '<span class="code-line"><span class="line-no">' + (i + 1) + '</span><span class="code-text">' + (escapeHtml(line) || " ") + '</span></span>';
                }).join("\n");
                return codeHtml;
            }

            function buildCardElement(page, handleTxt) {
                const el = document.createElement("div");
                el.className = "post-preview " + page.theme;

                const content = document.createElement("div");
                content.className = "post-content";

                content.innerHTML =
                    '<div class="post-header">' +
                    '<div class="post-avatar">' + initials(handleTxt) + '</div>' +
                    '<div class="post-handle">' + escapeHtml(handleTxt) + '</div>' +
                    '<div class="post-lang-badge">' + escapeHtml(langLabel(page.language)) + '</div>' +
                    '</div>' +
                    '<h1 class="post-title">' + escapeHtml(page.title) + '</h1>' +
                    '<div class="code-box">' +
                    '<div class="code-box-bar">' +
                    '<span class="code-box-dots"><i></i><i></i><i></i></span>' +
                    '<span class="code-box-filename">' + escapeHtml(page.filename) +
                    (page.fileTotal > 1 ? ' &nbsp;·&nbsp; parte ' + page.fileIndex + '/' + page.fileTotal : '') +
                    '</span>' +
                    '</div>' +
                    '<div class="code-box-body" style="font-size:' + page.fontSize + 'px; line-height:' + LINE_HEIGHT_RATIO + ';">' +
                    '<pre><code class="language-' + page.language + '"></code></pre>' +
                    '</div>' +
                    '</div>' +
                    (page.tip ? '<div class="tip-box"><span class="tip-label">💡 Dica</span><p>' + escapeHtml(page.tip) + '</p></div>' : '') +
                    '<div class="post-footer">' +
                    '<span>Arraste para o lado ➜</span>' +
                    '<span class="page-indicator">' + page.globalIndex + '/' + page.globalTotal + '</span>' +
                    '</div>';

                el.appendChild(content);

                // preenche o código já formatado e aplica o highlight.js linha a linha
                const codeEl = content.querySelector(".code-box-body code");
                codeEl.innerHTML = buildCodeHtml(page.lines, page.language);
                try {
                    // destaca cada .code-text isoladamente pra preservar a numeração de linha
                    codeEl.querySelectorAll(".code-text").forEach(function (span) {
                        span.classList.add("hljs");
                        hljs.highlightElement(span);
                    });
                } catch (e) { /* linguagem não suportada — mantém texto simples */ }

                return el;
            }

            /* =========================================================
               DOWNLOAD DE TODOS OS CARDS (PNG, em sequência)
               ========================================================= */
            downloadBtn.addEventListener("click", downloadAllCards);

            function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

            async function downloadAllCards() {
                const cardEls = Array.prototype.slice.call(trackEl.querySelectorAll(".post-preview"));
                if (cardEls.length === 0) return;

                downloadBtn.disabled = true;
                const projectSlug = slugify(document.getElementById("input-title").value || "carrossel");

                for (let i = 0; i < cardEls.length; i++) {
                    statusLine.textContent = "Gerando card " + (i + 1) + " de " + cardEls.length + "...";
                    try {
                        const canvas = await renderCardToCanvas(cardEls[i]);
                        const filename = projectSlug + "-card-" + pad(i + 1) + "-de-" + pad(cardEls.length) + ".png";
                        triggerDownload(canvas, filename);
                        await sleep(450); // dá tempo do navegador processar cada download
                    } catch (err) {
                        statusLine.textContent = "Erro ao gerar o card " + (i + 1) + ". Veja o console.";
                        console.error(err);
                    }
                }

                statusLine.textContent = "Pronto! " + cardEls.length + " cards baixados.";
                downloadBtn.disabled = false;
            }

            function pad(n) { return n < 10 ? "0" + n : String(n); }

            function slugify(str) {
                return String(str)
                    .toLowerCase()
                    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                    .replace(/[^a-z0-9]+/g, "-")
                    .replace(/(^-|-$)/g, "") || "carrossel";
            }

            async function renderCardToCanvas(originalEl) {
                // clona o card sem o transform de exibição (300px) pra capturar em 1080px reais
                const clone = originalEl.cloneNode(true);
                clone.style.transform = "none";
                clone.style.position = "fixed";
                clone.style.left = "-20000px";
                clone.style.top = "0";
                clone.style.width = "1080px";
                clone.style.height = "1080px";
                document.body.appendChild(clone);

                // pequeno delay pra garantir que fontes/estilos aplicaram no clone
                await sleep(30);

                const canvas = await html2canvas(clone, {
                    width: 1080,
                    height: 1080,
                    scale: 1,
                    useCORS: true,
                    backgroundColor: null
                });

                document.body.removeChild(clone);
                return canvas;
            }

            function triggerDownload(canvas, filename) {
                const link = document.createElement("a");
                link.download = filename;
                link.href = canvas.toDataURL("image/png");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

        })();
    </script>
</body>
