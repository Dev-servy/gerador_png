<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Gerador de Card CTA • Dev Instagram</title>
    <!-- Fonte do sistema -->
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f2f5;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            background: white;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            padding: 24px;
            align-items: flex-start;
        }

        /* Painel de controle */
        .control-panel {
            flex: 1 1 360px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-panel h2 {
            font-weight: 700;
            font-size: 1.5rem;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #334155;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        input,
        select,
        textarea {
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            transition: all 0.2s;
            outline: none;
            width: 100%;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            background: white;
        }

        .checkbox-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            background: #f1f5f9;
            padding: 12px;
            border-radius: 20px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            background: white;
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }

        .checkbox-item.active {
            background: #dbeafe;
            border-color: #3b82f6;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.2);
        }

        .checkbox-item input {
            display: none;
        }

        .btn-download {
            background: #0f172a;
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            box-shadow: 0 10px 20px -8px rgba(15, 23, 42, 0.4);
            margin-top: 8px;
        }

        .btn-download:hover {
            background: #1e293b;
            box-shadow: 0 15px 25px -8px rgba(15, 23, 42, 0.5);
            transform: translateY(-1px);
        }

        /* Área de preview */
        .preview-wrapper {
            flex: 1 1 500px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
        }

        .preview-container {
            background: #e9eef2;
            border-radius: 28px;
            padding: 16px;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.05);
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #post-preview {
            width: 1080px;
            height: 1080px;
            transform-origin: top left;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 30px 50px -20px black;
            position: relative;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, color 0.3s;
        }

        /* Estrutura interna do card (compartilhada) */
        .card-inner {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 70px 80px;
            position: relative;
            z-index: 2;
            justify-content: space-between;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .post-avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 42px;
            background: #1f6feb22;
            color: #58a6ff;
            border: 1px solid #1f6feb55;
            text-transform: uppercase;
        }

        .post-handle {
            font-size: 44px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .card-body {
            display: flex;
            flex-direction: column;
            gap: 50px;
            margin-top: 20px;
        }

        .post-title {
            font-size: 82px;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.02em;
            max-width: 90%;
        }

        .subtitle-message {
            font-size: 38px;
            font-weight: 500;
            line-height: 1.4;
            opacity: 0.9;
        }

        .engagement-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 28px;
            margin: 15px 0 5px;
        }

        .action-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 28px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            font-weight: 600;
            font-size: 28px;
        }

        .action-card svg {
            width: 64px;
            height: 64px;
        }

        .badge-cta {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 100px;
            padding: 26px 40px;
            font-size: 38px;
            font-weight: 700;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.25);
            margin-top: 10px;
        }

        .card-footer {
            font-size: 30px;
            font-weight: 500;
            opacity: 0.7;
            text-align: right;
            margin-top: 10px;
        }

        /* Ajustes de temas aplicados via classe no #post-preview */
        .theme-dark,
        .theme-neon,
        .theme-light,
        .theme-retro {
            /* classes dinâmicas */
        }

        /* Responsivo: scale no mobile */
        @media (max-width: 750px) {
            .preview-container {
                padding: 8px;
            }

            #post-preview {
                transform: scale(0.32);
                transform-origin: top left;
                margin-bottom: -700px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Painel de controle -->
        <div class="control-panel">
            <h2>⚡ Card Final CTA</h2>
            <div class="form-group">
                <label>@ Handle do Instagram</label>
                <input type="text" id="handleInput" value="@algoritmo.da.vez" placeholder="@seuperfil">
            </div>
            <div class="form-group">
                <label>Título de Fechamento</label>
                <input type="text" id="titleInput" value="Gostou do Conteúdo?" placeholder="Título impactante">
            </div>
            <div class="form-group">
                <label>Subtítulo / Mensagem</label>
                <textarea id="subtitleInput" rows="2"
                    placeholder="Incentive a ação...">Salve este post para não perder as dicas quando for codar.</textarea>
            </div>
            <div class="form-group">
                <label>Texto do Botão / Badge</label>
                <input type="text" id="badgeInput" value="Siga @algoritmo.da.vez para mais"
                    placeholder="Call to action final">
            </div>

            <label style="margin-bottom:-8px;">Ações visuais (ícones)</label>
            <div class="checkbox-grid" id="actionCheckboxes">
                <label class="checkbox-item active" data-action="save">
                    <input type="checkbox" checked> 📌 Salvar
                </label>
                <label class="checkbox-item active" data-action="comment">
                    <input type="checkbox" checked> 💬 Comentar
                </label>
                <label class="checkbox-item active" data-action="share">
                    <input type="checkbox" checked> 🚀 Compartilhar
                </label>
                <label class="checkbox-item active" data-action="like">
                    <input type="checkbox" checked> ❤️ Curtir
                </label>
            </div>

            <div class="form-group">
                <label>Tema Visual</label>
                <select id="themeSelect">
                    <option value="theme-dark">🌙 Dark Code</option>
                    <option value="theme-neon">💜 Neon Synth</option>
                    <option value="theme-light">☁️ Clean Light</option>
                    <option value="theme-retro">🖥️ Retro Terminal</option>
                </select>
            </div>

            <button class="btn-download" id="downloadBtn">
                <span>📷</span> Baixar Card Final (PNG)
            </button>
            <p style="font-size:0.8rem; color:#64748b; text-align:center;">Preview em tempo real • 1080x1080</p>
        </div>

        <!-- Preview -->
        <div class="preview-wrapper">
            <div class="preview-container">
                <div id="post-preview" class="theme-dark">
                    <!-- Conteúdo dinâmico inserido via JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            // Elementos DOM
            const preview = document.getElementById('post-preview');
            const handleInput = document.getElementById('handleInput');
            const titleInput = document.getElementById('titleInput');
            const subtitleInput = document.getElementById('subtitleInput');
            const badgeInput = document.getElementById('badgeInput');
            const themeSelect = document.getElementById('themeSelect');
            const checkboxContainer = document.getElementById('actionCheckboxes');
            const downloadBtn = document.getElementById('downloadBtn');

            // Estado das ações (checkboxes)
            let activeActions = {
                save: true,
                comment: true,
                share: true,
                like: true
            };

            // Mapeamento de ações para ícones SVG e textos
            const actionMap = {
                save: {
                    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`,
                    label: "Salvar"
                },
                comment: {
                    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,
                    label: "Comentar"
                },
                share: {
                    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>`,
                    label: "Compartilhar"
                },
                like: {
                    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
                    label: "Curtir"
                }
            };

            // Atualiza preview
            function updatePreview() {
                const handle = handleInput.value.trim() || '@dev';
                const title = titleInput.value.trim() || 'Título';
                const subtitle = subtitleInput.value.trim() || 'Mensagem';
                const badgeText = badgeInput.value.trim() || 'Siga para mais';
                const theme = themeSelect.value;

                // Remove classes de tema anteriores e aplica a nova
                preview.className = theme;

                // Gera avatar com primeira letra do handle (sem @)
                const handleClean = handle.replace('@', '');
                const avatarLetter = handleClean.charAt(0).toUpperCase() || 'D';

                // Constroi grid de ações baseado nos ativos
                let actionsHTML = '';
                const activeKeys = Object.keys(activeActions).filter(key => activeActions[key]);

                if (activeKeys.length === 0) {
                    actionsHTML = '<div class="action-card" style="grid-column:span 4;">✨ Nenhuma ação selecionada</div>';
                } else {
                    activeKeys.forEach(key => {
                        const action = actionMap[key];
                        actionsHTML += `
            <div class="action-card">
              ${action.icon}
              <span>${action.label}</span>
            </div>
          `;
                    });
                    // Se tiver menos de 4 itens, preenche com espaços vazios para manter grid
                    if (activeKeys.length < 4) {
                        const emptyCount = 4 - activeKeys.length;
                        for (let i = 0; i < emptyCount; i++) {
                            actionsHTML += '<div class="action-card" style="opacity:0.4;"></div>';
                        }
                    }
                }

                // Template do card interno
                const cardHTML = `
        <div class="card-inner">
          <div class="card-header">
            <div class="post-avatar">${avatarLetter}</div>
            <span class="post-handle">${handle}</span>
          </div>
          <div class="card-body">
            <div class="post-title">${title}</div>
            <div class="subtitle-message">${subtitle}</div>
            <div class="engagement-grid">
              ${actionsHTML}
            </div>
            <div class="badge-cta">${badgeText}</div>
          </div>
          <div class="card-footer">${handle}</div>
        </div>
      `;

                preview.innerHTML = cardHTML;
            }

            // Gerenciar toggles dos checkboxes
            function setupCheckboxes() {
                const items = checkboxContainer.querySelectorAll('.checkbox-item');
                items.forEach(item => {
                    const checkbox = item.querySelector('input[type="checkbox"]');
                    const action = item.dataset.action;

                    // Sincroniza estado inicial
                    checkbox.checked = activeActions[action];
                    item.classList.toggle('active', activeActions[action]);

                    item.addEventListener('click', (e) => {
                        e.preventDefault();
                        activeActions[action] = !activeActions[action];
                        checkbox.checked = activeActions[action];
                        item.classList.toggle('active', activeActions[action]);
                        updatePreview();
                    });
                });
            }

            // Download PNG usando canvas
            function downloadCardAsPNG() {
                // Usamos html2canvas dinamicamente (CDN) para gerar imagem de alta qualidade
                // Como é frontend puro, carregamos a library sob demanda.
                const scriptId = 'html2canvas-script';
                if (document.getElementById(scriptId)) {
                    generateAndDownload();
                    return;
                }

                const script = document.createElement('script');
                script.id = scriptId;
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
                script.onload = () => {
                    generateAndDownload();
                };
                script.onerror = () => {
                    alert('Erro ao carregar biblioteca de download. Tente novamente.');
                };
                document.head.appendChild(script);
            }

            function generateAndDownload() {
                if (typeof html2canvas === 'undefined') {
                    alert('Biblioteca não carregada. Recarregue a página.');
                    return;
                }

                const element = document.getElementById('post-preview');
                // Força escala para garantir 1080x1080 nítido
                html2canvas(element, {
                    scale: 1, // já é 1080px interno, mas html2canvas renderiza no tamanho real
                    backgroundColor: null,
                    allowTaint: false,
                    useCORS: true,
                    logging: false
                }).then(canvas => {
                    // Converte para PNG e dispara download
                    const link = document.createElement('a');
                    link.download = `card-cta-${Date.now()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(error => {
                    console.error('Erro ao gerar imagem:', error);
                    alert('Falha ao gerar PNG. Tente em outro navegador.');
                });
            }

            // Event listeners
            handleInput.addEventListener('input', updatePreview);
            titleInput.addEventListener('input', updatePreview);
            subtitleInput.addEventListener('input', updatePreview);
            badgeInput.addEventListener('input', updatePreview);
            themeSelect.addEventListener('change', updatePreview);
            downloadBtn.addEventListener('click', downloadCardAsPNG);

            // Inicialização
            setupCheckboxes();
            updatePreview();

            // Ajuste responsivo adicional (escala dinâmica se necessário, mas css já trata)
            window.addEventListener('resize', () => {
                // Apenas para manter consistência, sem ações adicionais
            });

        })();
    </script>
</body>

</html>
